# Configuración SOLO para las pruebas: base H2 en memoria.
# Así las pruebas corren sin XAMPP y no tocan la base bd_huerto real.
spring.application.name=huertoapi-test

spring.datasource.url=jdbc:h2:mem:huerto_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

server.error.include-message=always
