spring.application.name=huertoapi
server.port=8080

# MySQL (XAMPP / Laragon). La base se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/bd_huerto?createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Muestra el motivo del error en la respuesta (ej: "El sector indicado no existe")
server.error.include-message=always
